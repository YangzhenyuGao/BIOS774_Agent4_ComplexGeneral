task_id: task_t
view_dir: outputs/task_t/agent_view
question: >-
  Given the clinical information already available (including ER, PR and HER2 status), does adding the H&E
  pathology images improve the four-class PAM50 prediction? How large is the gain, and how certain is the evidence?
question_original_zh: >-
  在已有临床信息（包括 ER、PR、HER2）的基础上，加入 H&E 病理图像能否改善 PAM50 四分类预测？增益有多大，证据有多确定？
alternative_question: >-
  From the H&E pathology images alone, how much of the PAM50 subtype information can be predicted?

dataset_card:
  name: TCGA-BRCA diagnostic slides with clinical variables
  unit: patient
  description: >-
    Breast cancer patients with H&E whole-slide images and six clinical variables: age, stage, histological type,
    and the receptor statuses ER, PR and HER2 from immunohistochemistry. Images are represented by frozen
    pathology foundation models: five encoders, each giving one feature vector per tile (up to 128 tiles per slide,
    identical tile positions across encoders) and a mean-pooled vector per patient. The label is the PAM50 intrinsic
    subtype in four classes. Patients without a label still have images. Each patient has a collection site.
  label_provenance:
    statement: >-
      PAM50 is computed from the tumour's RNA expression. Receptor status is correlated with PAM50 but is a separate
      clinical measurement and is not equivalent to it (immunohistochemistry surrogates disagree with PAM50 for a
      substantial share of tumours).
    implication: >-
      No RNA-derived variable may be used as an input. Whether receptors may be used depends on the question asked:
      they are a legitimate baseline when the question is what images add to clinical information, and a forbidden
      shortcut when the question is what images alone contain.
  scope_of_inference: incremental predictive value in this cohort; not an independent biological mechanism
  how_predictions_are_scored: >-
    The evaluator re-runs every method inside its own repeated nested cross-validation on the labelled patients
    (outer 5 folds repeated 3 times, patient-level; any model or configuration choice happens only inside the
    training folds) and compares it with a fixed, fully tuned clinical-only model on the same patients and folds.
  rulers:
    floor_clinical: clinical variables only, fixed and fully tuned by the evaluator; the gain is measured against it
    simple_reference: clinical variables plus mean-pooled image features in a logistic regression; complex methods are compared with it
    historical_reference: an earlier project's late fusion reached macro-F1 0.723 on a single 121-patient test split (not ground truth)
  decision_rule: >-
    Primary metric: paired difference in macro-F1 (image plus clinical minus clinical only) with a patient-level
    bootstrap 95% interval. Conclusion, from the interval alone: "improves" if the lower bound is above 0;
    "insufficient evidence" if the interval contains 0; "worse" if the upper bound is below 0. Secondary:
    log-loss difference, one-vs-rest AUROC difference, per-class recall changes (LumA and LumB in particular),
    and a site-held-out sensitivity analysis. Both arms must use the same patients and the same missing-value handling.
  deliverable: >-
    The estimated gain with its interval, the three-way conclusion, out-of-fold predictions for both arms, and
    the per-class changes.

limits:
  n_plans: 6
  min_ambitious: 4
  n_candidates_requested: 8
  plans_per_call: 1
  full_run_minutes: 120
  cpus_per_job: 16
